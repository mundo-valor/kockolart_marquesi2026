<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rockola de Marquesi</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--accent-red);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
        }

        .paypal-btn {
            background-color: var(--accent-red);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .paypal-btn:hover {
            background-color: #b20710;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar, .main-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        h3 {
            color: var(--accent-red);
            margin-top: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .counter-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: block;
        }

        .results-list {
            max-height: 420px;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .results-list li {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-size: 0.95rem;
        }

        .results-list li:hover {
            background-color: #222;
            color: var(--accent-red);
        }

        .player-container {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Reproductor con mayor presencia visual */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .welcome-msg {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>MARQUESI</span>
        </div>
        <a href="https://paypal.com" target="_blank" class="paypal-btn" rel="noopener noreferrer">☕ Apoyar Proyecto (PayPal)</a>
    </header>

    <div class="container">
        <!-- Panel Izquierdo: Buscador y Listado -->
        <div class="sidebar">
            <h3>🔍 Buscar Producción</h3>
            <input type="text" id="searchInput" placeholder="Ej. Paquito, Osito, Pedro..." oninput="filterTracks()">
            <span id="counterBadge" class="counter-badge">Cargando catálogo...</span>

            <h3>Selección Rápida</h3>
            <ul id="tracksList" class="results-list">
                <!-- Se llena dinámicamente con JavaScript -->
            </ul>
        </div>

        <!-- Panel Derecho: Reproductor -->
        <div class="main-content player-container">
            <div id="playerArea" style="width: 100%; display: flex; justify-content: center; align-items: center; height: 100%;">
                <div style="text-align: center;">
                    <h2 style="color: var(--text-main); margin-bottom: 10px;">Bienvenido a La Rockola de Marquesi</h2>
                    <p class="welcome-msg">Selecciona una producción de la izquierda para comenzar a reproducir.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allTracks = [];

        // Cargar el archivo rockola_data.json automáticamente
        fetch('rockola_data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('No se pudo cargar el catálogo de canciones.');
                }
                return response.json();
            })
            .then(data => {
                // Ordenar alfabéticamente por artista de forma predeterminada
                allTracks = data.sort((a, b) => {
                    const artistA = (a.artist || "").toLowerCase();
                    const artistB = (b.artist || "").toLowerCase();
                    return artistA.localeCompare(artistB);
                });

                document.getElementById('counterBadge').innerText = `Total en catálogo: ${allTracks.length} producciones`;
                displayTracks(allTracks);
            })
            .catch(error => {
                console.error('Error al cargar el archivo JSON:', error);
                document.getElementById('counterBadge').innerText = 'Error al cargar el catálogo.';
                document.getElementById('tracksList').innerHTML = '<li style="color: #e50914; cursor: default;">Verifica que rockola_data.json esté en el mismo repositorio.</li>';
            });

        // Mostrar listado en pantalla
        function displayTracks(tracks) {
            const listElement = document.getElementById('tracksList');
            listElement.innerHTML = '';

            if (tracks.length === 0) {
                listElement.innerHTML = '<li style="color: var(--text-muted); cursor: default;">No se encontraron resultados</li>';
                return;
            }

            const limitTracks = tracks.slice(0, 150);

            limitTracks.forEach(track => {
                const li = document.createElement('li');
                li.textContent = track.artist;
                li.onclick = () => playTrack(track);
                listElement.appendChild(li);
            });
        }

        // Filtro flexible con includes
        function filterTracks() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (query === "") {
                document.getElementById('counterBadge').innerText = `Total en catálogo: ${allTracks.length} producciones`;
                displayTracks(allTracks);
                return;
            }

            const filtered = allTracks.filter(track => {
                const artistMatch = track.artist && track.artist.toLowerCase().includes(query);
                const titleMatch = track.title && track.title.toLowerCase().includes(query);
                return artistMatch || titleMatch;
            });

            document.getElementById('counterBadge').innerText = `Encontrados: ${filtered.length} resultados`;
            displayTracks(filtered);
        }

        // Reproducir video sin texto superior y con un reproductor más amplio
        function playTrack(track) {
            const playerArea = document.getElementById('playerArea');
            playerArea.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';

            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${track.id}?autoplay=1`;
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
            iframe.setAttribute('allowfullscreen', 'true');

            wrapper.appendChild(iframe);
            playerArea.appendChild(wrapper);
        }
    </script>
</body>
</html>
